<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Login - Job Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5">
<div class="card col-md-5 mx-auto p-4 shadow">
<h3 class="text-center">🔐 Login</h3>
<div th:if="${param.error}" class="alert alert-danger">Invalid Email or Password!</div>
<div th:if="${param.success}" class="alert alert-success">Registration Success! Please Login</div>
<form th:action="@{/login}" method="post">
<input type="email" name="email" placeholder="Email" class="form-control mb-3" required>
<input type="password" name="password" placeholder="Password" class="form-control mb-3" required>
<button class="btn btn-success w-100">Login</button>
</form>
<p class="text-center mt-3">No account? <a href="/register">Register</a></p>
</div>
</div>
</body></html>
