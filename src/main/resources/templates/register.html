<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register - Job Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5">
<div class="card col-md-5 mx-auto p-4 shadow">
<h3 class="text-center">📝 Register</h3>
<div th:if="${param.error}" class="alert alert-danger">Email already exists!</div>
<form th:action="@{/register}" th:object="${user}" method="post">
<input type="text" th:field="*{username}" placeholder="Full Name" class="form-control mb-3" required>
<input type="email" th:field="*{email}" placeholder="Email" class="form-control mb-3" required>
<input type="password" th:field="*{password}" placeholder="Password" class="form-control mb-3" required>
<select th:field="*{role}" class="form-control mb-3">
<option value="STUDENT">Student</option>
<option value="RECRUITER">Recruiter</option>
</select>
<button class="btn btn-primary w-100">Register</button>
</form>
<p class="text-center mt-3">Already have account? <a href="/login">Login</a></p>
</div>
</div>
</body></html>
