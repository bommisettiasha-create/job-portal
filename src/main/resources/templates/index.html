<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Job Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2>Job Portal - All Jobs</h2>
<a href="/add-job" class="btn btn-primary mb-3">Add New Job</a>
<table class="table table-bordered">
<tr><th>Title</th><th>Company</th><th>Location</th><th>Action</th></tr>
<tr th:each="job : ${jobs}">
<td th:text="${job.title}"></td>
<td th:text="${job.company}"></td>
<td th:text="${job.location}"></td>
<td><a th:href="@{/delete/{id}(id=${job.id})}" class="btn btn-danger btn-sm">Delete</a></td>
</tr>
</table>
</body>
</html>
