<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Job Portal - Jobs</title>
<style>
body{font-family:Arial,sans-serif; background:#f5f5f5; margin:0; padding:0;}
.navbar{background:#2c3e50; color:white; padding:15px 30px; display:flex; justify-content:space-between; align-items:center;}
.navbar h2{margin:0;}
.navbar span{color:#f1c40f;}
.btn-add{background:#3498db; color:white; padding:8px 15px; border:none; border-radius:5px; text-decoration:none; margin-right:10px;}
.btn-logout{background:#e74c3c; color:white; padding:8px 15px; border:none; border-radius:5px; text-decoration:none;}
.container{padding:20px 30px;}
.count{background:white; padding:15px; border-radius:8px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.jobs-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px;}
.job-card{background:white; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.job-card h3{margin:0 0 5px 0; color:#2c3e50;}
.company{color:#7f8c8d; font-weight:bold;}
.location{background:#ecf0f1; padding:5px 10px; border-radius:15px; font-size:12px; display:inline-block; margin:10px 0;}
.jobType{float:right; background:#2ecc71; color:white; padding:5px 10px; border-radius:15px; font-size:12px;}
.description{color:#555; font-size:14px; margin:10px 0; min-height:40px;}
.salary{color:#27ae60; font-weight:bold; font-size:16px;}
.btn-apply{background:#27ae60; color:white; padding:10px; width:100%; border:none; border-radius:5px; cursor:pointer; font-size:15px; margin-top:10px;}
.btn-apply:hover{background:#219a52;}
</style>
</head>
<body>

<div class="navbar">
<h2>Job Portal <span th:text="'(' + ${loggedInUser} + ')'"></span></h2>
<div>
<a href="/jobs/add" class="btn-add">+ Add Job</a>
<a href="/logout" class="btn-logout">Logout</a>
</div>
</div>

<div class="container">
<div class="count">
<h3 style="margin:0;">Available Jobs (<span th:text="${#lists.size(jobs)}">0</span>)</h3>
</div>

<div class="jobs-grid">
<div class="job-card" th:each="job : ${jobs}">
<div>
<span class="jobType" th:text="${job.jobType}">Full Time</span>
<h3 th:text="${job.title}">Java Developer</h3>
<div class="company" th:text="${job.company}">TCS</div>
</div>

<div class="location" th:text="${job.location}">Hyderabad</div>

<p class="description" th:text="${job.description}">Job description here...</p>

<div class="salary" th:text="'₹ ' + ${job.salary} + ' / year'">₹ 600000 / year</div>

<a th:href="@{/jobs/apply/{id}(id=${job.id})}" style="text-decoration:none;">
<button class="btn-apply" type="button">Apply Now</button>
</a>

</div>
</div>

<p th:if="${#lists.isEmpty(jobs)}" style="text-align:center; color:gray; margin-top:50px;">No Jobs Found! Please Add a Job.</p>

</div>

</body>
</html>
