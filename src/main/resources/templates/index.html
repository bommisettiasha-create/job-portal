<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Job Portal - Find Dream Job</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:40px; border-radius:15px; }
.job-card:hover { transform: scale(1.02); transition:0.2s; box-shadow:0 8px 20px rgba(0,0,0,0.15)!important; }
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4 d-flex justify-content-between">
<a class="navbar-brand fw-bold">💼 Job Portal</a>
<div>
<a href="/applications" class="btn btn-warning btn-sm fw-bold me-2">📄 View Applications</a>
<span class="text-white">Welcome Recruiter</span>
</div>
</nav>

<div class="container mt-4">
<div class="hero mb-4 text-center">
<h1>Find Your Dream Job Now</h1>
<p>Search from 1000+ jobs - TCS, Infosys, Wipro</p>
<form th:action="@{/}" method="get" class="d-flex justify-content-center gap-2 mt-3">
<input type="text" name="keyword" th:value="${keyword}" placeholder="Search Java, TCS, Hyderabad..." class="form-control w-50">
<button type="submit" class="btn btn-warning fw-bold">Search</button>
<a href="/" class="btn btn-light">Clear</a>
</form>
</div>

<div class="card p-4 mb-4 shadow-sm">
<h5>➕ Post a New Job</h5>
<form th:action="@{/add}" th:object="${job}" method="post">
<div class="row">
<div class="col-md-3 mb-2"><input type="text" th:field="*{title}" placeholder="Job Title (Ex: Java Dev)" class="form-control" required></div>
<div class="col-md-3 mb-2"><input type="text" th:field="*{company}" placeholder="Company" class="form-control" required></div>
<div class="col-md-2 mb-2"><input type="text" th:field="*{location}" placeholder="Location" class="form-control" required></div>
<div class="col-md-2 mb-2"><input type="text" th:field="*{salary}" placeholder="Salary (Ex: 10 LPA)" class="form-control"></div>
<div class="col-md-2 mb-2"><button type="submit" class="btn btn-primary w-100">Add Job</button></div>
</div>
<input type="text" th:field="*{description}" placeholder="Job Description" class="form-control mt-2">
</form>
</div>

<div class="row">
<div class="col-md-6 mb-3" th:each="job : ${jobs}">
<div class="card job-card shadow-sm p-3 h-100">
<div class="d-flex justify-content-between">
<h5 th:text="${job.title}" class="text-primary"></h5>
<span class="badge bg-success" th:text="${job.salary}"></span>
</div>
<h6 th:text="${job.company}" class="text-muted"></h6>
<p class="mb-1">📍 <span th:text="${job.location}"></span></p>
<p th:text="${job.description}" class="small text-secondary"></p>
<div class="mt-2 d-flex gap-1">
<a th:href="@{/view/{id}(id=${job.id})}" class="btn btn-outline-primary btn-sm">View</a>
<a th:href="@{/apply/{id}(id=${job.id})}" class="btn btn-success btn-sm">Apply</a>
<a th:href="@{/edit/{id}(id=${job.id})}" class="btn btn-outline-warning btn-sm">Edit</a>
<a th:href="@{/delete/{id}(id=${job.id})}" class="btn btn-outline-danger btn-sm">Delete</a>
</div>
</div>
</div>
</div>

<div th:if="${#lists.isEmpty(jobs)}" class="alert alert-info text-center">No Jobs Found! Try different keyword.</div>
</div>
</body>
</html>
