<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card p-4 shadow col-md-6 mx-auto">
        <h3 class="text-center mb-4">Edit Job</h3>
        <form th:action="@{/update/{id}(id=${job.id})}" th:object="${job}" method="post">
            <div class="mb-3">
                <label>Job Title</label>
                <input type="text" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Company</label>
                <input type="text" th:field="*{company}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Location</label>
                <input type="text" th:field="*{location}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Salary</label>
                <input type="text" th:field="*{salary}" class="form-control">
            </div>
            <div class="mb-3">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Update Job</button>
            <a href="/" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
