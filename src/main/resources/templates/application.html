<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Recruiter - Applicants</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container mt-4">
<h2>👨‍💼 Recruiter - All Applicants</h2>
<a href="/" class="btn btn-secondary mb-2">Back</a>
<a href="/admin" class="btn btn-dark mb-2 ms-2">Admin Dashboard</a>
<table class="table table-bordered">
<thead class="table-dark"><tr><th>Job</th><th>Student</th><th>Email</th><th>Resume</th><th>Status</th><th>Action</th></tr></thead>
<tbody>
<tr th:each="app : ${applications}">
<td th:text="${app.jobTitle}"></td>
<td th:text="${app.applicantName}"></td>
<td th:text="${app.email}"></td>
<td><span class="badge bg-info" th:text="${app.resumeFileName}"></span></td>
<td><span class="badge" th:classappend="${app.status=='PENDING'?'bg-warning':app.status=='SHORTLISTED'?'bg-success':'bg-danger'}" th:text="${app.status}"></span></td>
<td>
<a th:href="@{/updateStatus/{id}/SHORTLISTED(id=${app.id})}" class="btn btn-success btn-sm">Shortlist</a>
<a th:href="@{/updateStatus/{id}/REJECTED(id=${app.id})}" class="btn btn-danger btn-sm">Reject</a>
</td>
</tr>
</tbody>
</table>
</body></html>
