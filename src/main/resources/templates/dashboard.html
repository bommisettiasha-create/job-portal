<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container mt-4">
<h2>🎓 Student Dashboard Statistics</h2>
<a href="/" class="btn btn-secondary mb-3">Back to Jobs</a>
<div class="row">
<div class="col-md-4"><div class="card p-3 text-center shadow"><h2 th:text="${totalJobs}"></h2><p>Available Jobs</p></div></div>
<div class="col-md-4"><div class="card p-3 text-center shadow"><h2 th:text="${myApplications}"></h2><p>My Applications</p></div></div>
<div class="col-md-4"><div class="card p-3 text-center shadow"><h2 th:text="${mySaved}"></h2><p>Saved Jobs</p></div></div>
</div>
</body></html>
