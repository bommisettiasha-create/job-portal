<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Apply Job</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}.box{background:white;width:500px;margin:50px auto;padding:25px;border-radius:8px;text-align:center}button{background:#27ae60;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer;font-size:16px}</style>
</head>
<body>
<div class="box">
<h2 th:text="${job.title}"></h2>
<p><b th:text="${job.company}"></b> - <span th:text="${job.location}"></span></p>
<p th:text="${job.description}"></p>
<p><b th:text="'Salary: ₹ ' + ${job.salary}"></b></p>
<hr>
<form th:action="@{/jobs/apply/{id}(id=${job.id})}" method="post">
<button type="submit">Confirm Apply</button>
</form>
<br><a href="/jobs">Back to Jobs</a>
</div>
</body>
</html>
