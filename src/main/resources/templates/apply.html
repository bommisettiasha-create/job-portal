<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Apply Job</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="card p-4 shadow col-md-6 mx-auto">
<h3>Apply for <span th:text="${job.title}" class="text-primary"></span></h3>
<p th:text="${job.company}"></p>
<form th:action="@{/apply/{id}(id=${job.id})}" th:object="${application}" method="post" enctype="multipart/form-data">
<input type="text" th:field="*{applicantName}" placeholder="Your Full Name" class="form-control mb-3" required>
<input type="email" th:field="*{email}" placeholder="Your Email" class="form-control mb-3" required>
<input type="text" th:field="*{phone}" placeholder="Phone Number" class="form-control mb-3" required>
<label class="fw-bold">Upload Resume (PDF):</label>
<input type="file" name="resumeFile" accept=".pdf,.doc,.docx" class="form-control mb-3" required>
<button type="submit" class="btn btn-success w-100">Submit Application</button>
</form>
<a href="/" class="btn btn-link mt-2">Cancel</a>
</div>
</body>
</html>
