<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Add Job</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2>Add Job</h2>
<form th:action="@{/save-job}" th:object="${job}" method="post">
<div class="mb-3"><label>Title</label><input th:field="*{title}" class="form-control"><span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></span></div>
<div class="mb-3"><label>Company</label><input th:field="*{company}" class="form-control"></div>
<div class="mb-3"><label>Location</label><input th:field="*{location}" class="form-control"></div>
<div class="mb-3"><label>Skills</label><input th:field="*{skills}" class="form-control"></div>
<div class="mb-3"><label>Description</label><textarea th:field="*{description}" class="form-control"></textarea></div>
<button type="submit" class="btn btn-success">Save</button>
<a href="/" class="btn btn-secondary">Back</a>
</form>
</body>
</html>
